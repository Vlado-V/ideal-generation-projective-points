name = "idealGeneration"
version = "0.1.0"
defaultTargets = ["IdealGeneration", "Solution"]
moreLeanArgs = ["-j1", "-DwarningAsError=true", "-DrelaxedAutoImplicit=false"]
requiresModuleSystem = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "8accc04827c389e678c3ef83e623b402e7480394"

# Module ownership and scheduling follow the earlier proof repositories.
# Each exact module glob owns one local source. Three dependency chains cap
# local Lean elaboration at three concurrent jobs; large data modules consume
# all three chains so their elaboration runs alone. Mathematical sources and
# proof dependencies are unchanged by this scheduling configuration.

[[lean_lib]]
name = "IdealGeneration"
globs = ["IdealGeneration"]
needs = ["MemoryOrder0601"]

[[lean_lib]]
name = "Solution"
globs = ["Solution"]
needs = ["MemoryOrder0602"]

# The statement-only Challenge has an intentional proof hole for Comparator.
# It is built separately after the proof targets and is outside the strict
# default build. Its compiler reports the expected proof-hole warning.
[[lean_lib]]
name = "Challenge"
globs = ["Challenge"]
moreLeanArgs = ["-DwarningAsError=false"]
needs = ["MemoryOrder0603", "IdealGeneration", "Solution"]

